<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prompts Jurídicos IA</title>
<meta name="description" content="10 prompts jurídicos profissionais para ChatGPT, Claude e Gemini. Copie e cole com 1 toque.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 0 0 80px; }
  .header { background: linear-gradient(135deg, #1e3a5f, #0f172a); padding: 40px 20px 24px; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 1.3em; color: #60a5fa; }
  .header p { font-size: 0.85em; color: #94a3b8; margin-top: 4px; }
  .search { margin: 12px 20px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .search input { background: transparent; border: none; color: #e2e8f0; font-size: 0.95em; width: 100%; outline: none; }
  .search input::placeholder { color: #64748b; }
  .grid { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; transition: all 0.2s; }
  .card-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .card-header:active { background: #334155; }
  .card-title { font-weight: 600; font-size: 0.95em; }
  .card-arrow { color: #64748b; font-size: 0.8em; transition: transform 0.2s; }
  .card.open .card-arrow { transform: rotate(180deg); }
  .card-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .card.open .card-body { max-height: 600px; }
  .card-body pre { background: #0f172a; color: #a5f3fc; padding: 14px 16px; font-size: 0.78em; line-height: 1.5; white-space: pre-wrap; margin: 0; border-radius: 0; }
  .card-actions { display: flex; gap: 8px; padding: 8px 16px 14px; }
  .btn-action { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.85em; cursor: pointer; transition: all 0.15s; text-align: center; text-decoration: none; }
  .btn-copy { background: #2563eb; color: #fff; }
  .btn-copy:active { background: #1d4ed8; }
  .btn-copy.copied { background: #22c55e; }
  .btn-open { background: #334155; color: #e2e8f0; }
  .btn-open:active { background: #475569; }
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #052e16; padding: 10px 24px; border-radius: 8px; font-weight: 600; font-size: 0.85em; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .footer-cta { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid #334155; padding: 12px 16px; display: flex; gap: 10px; }
  .btn-buy { flex: 1; background: #22c55e; color: #052e16; font-weight: 700; padding: 12px; border-radius: 10px; text-decoration: none; text-align: center; font-size: 0.95em; }
  .btn-buy:active { background: #4ade80; }
  @media (prefers-color-scheme: light) {
    body { background: #f8fafc; color: #1e293b; }
    .header { background: linear-gradient(135deg, #dbeafe, #f8fafc); }
    .header h1 { color: #1d4ed8; }
    .card { background: #fff; border-color: #e2e8f0; }
    .card-body pre { background: #f1f5f9; color: #0f172a; }
    .btn-open { background: #e2e8f0; color: #1e293b; }
    .search { background: #fff; border-color: #e2e8f0; }
    .search input { color: #1e293b; }
    .footer-cta { background: #f8fafc; border-color: #e2e8f0; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>⚖️ Prompts Jurídicos IA</h1>
  <p>10 prompts profissionais com checklist de validação • Toque para expandir</p>
</div>
<div class="search">
  <span>🔍</span>
  <input type="text" id="searchInput" placeholder="Buscar prompt..." oninput="filterPrompts()">
</div>
<div class="grid" id="promptsGrid"></div>
<div class="toast" id="toast">✅ Copiado!</div>
<div class="footer-cta">
  <a class="btn-buy" href="../produtos/prompts-ia-advocacia/pagina-venda.html">📥 Comprar Pack Completo — R$ 47</a>
</div>

<script>
const PROMPTS = [
  { nome: "Resumo de Petição",
    prompt: `# PAPEL\nVocê é um assistente especializado em Direito...\n\n# TAREFA\n1. Identifique: ação, partes, valor da causa, juízo\n2. Extraia as teses principais do autor\n3. Aponte jurisprudências mencionadas\n\n# FORMATO DE SAÍDA\n📌 Resumo executivo (máx. 5 linhas)\n⚖️ Teses principais\n🚨 Alertas de validação humana\n📊 Nível de confiança\n\n⚠️ CHECKLIST:\n[ ] A lei citada existe?\n[ ] A jurisprudência é do tribunal certo?` },
  { nome: "Pesquisa de Jurisprudência",
    prompt: `# PAPEL\nPesquisador jurídico especializado em jurisprudência brasileira.\n\n# TAREFA\n1. Sugira tribunais relevantes\n2. Liste súmulas aplicáveis\n3. Sugira palavras-chave de busca\n4. Aponte decisões paradigmáticas\n\n⚠️ NUNCA cite jurisprudência falsa. Indique nível de confiança.` },
  { nome: "Análise de Contrato",
    prompt: `# PAPEL\nAdvogado contratualista sênior (CC arts. 421-480, CDC, Lei Liberdade Econômica).\n\n# TAREFA\n1. Identifique tipo contratual\n2. Cláusula por cláusula: risco (baixo/médio/alto)\n3. Sugestão de alteração\n\n⚠️ Toda análise deve mencionar o dispositivo legal aplicável.` },
  { nome: "Resposta a Cliente",
    prompt: `# PAPEL\nAdvogado especializado em comunicação jurídica.\n\n# TAREFA\nTraduza juridiquês para linguagem simples e empática.\n\n# FORMATO\n📧 Assunto | 👋 Abertura | 📝 Explicação clara | 📋 Próximos passos\n\n⚠️ NUNCA garanta resultado de processo.` },
  { nome: "Petição Inicial (esqueleto)",
    prompt: `# PAPEL\nAdvogado especializado em CPC/2015.\n\n# TAREFA\nGere estrutura de petição inicial:\n1. Endereçamento\n2. Qualificação das partes\n3. Fatos\n4. Fundamentos jurídicos\n5. Pedidos\n6. Provas\n7. Valor da causa\n\n⚠️ É um ESQUELETO — revisão humana obrigatória.` },
  { nome: "Due Diligence",
    prompt: `# PAPEL\nAdvogado especializado em due diligence societária.\n\n# TAREFA\nVerifique por categoria:\n✅ Societário | ✅ Fiscal | ✅ Trabalhista | ✅ Contratual | ✅ Regulatório\n\n📋 Aponte documentos faltantes e riscos.\n⚠️ Due diligence automatizada é triagem, não auditoria completa.` },
  { nome: "Parecer Preliminar",
    prompt: `# PAPEL\nAdvogado consultivo sênior.\n\n# TAREFA\n1. Identifique tema e normas aplicáveis\n2. Análise prós e contras\n3. Conclusão com nível de confiança\n4. Recomendações práticas\n\n⚠️ Parecer automatizado é rascunho — revisão obrigatória.` },
  { nome: "E-mail de Negociação",
    prompt: `# PAPEL\nAdvogado especializado em negociação e resolução consensual.\n\n# TAREFA\nRedija e-mail com:\n1. Rapport\n2. Posição objetiva\n3. Proposta clara\n4. Espaço para diálogo\n\n⚠️ Comunicação escrita pode virar prova — ajuste o tom.` },
  { nome: "Ata de Reunião",
    prompt: `# PAPEL\nAssistente de documentação jurídica.\n\n# TAREFA\nEstruture em ata:\n📅 Data e participantes\n📋 Pauta\n💬 Discussão\n✅ Decisões\n📌 Pendências (com responsável e prazo)\n\n⚠️ NUNCA invente participantes ou falas.` },
  { nome: "Compliance LGPD",
    prompt: `# PAPEL\nEspecialista em privacidade (Lei 13.709/2018).\n\n# TAREFA\nAudite:\n1. Base legal (art. 7º ou 11)\n2. Dados pessoais vs. sensíveis\n3. Direitos do titular (art. 18)\n4. Medidas de segurança\n\n📋 Aponte não-conformidades e plano de ação.\n⚠️ ANPD intensificou fiscalizações em 2026.` }
];

function render() {
  const grid = document.getElementById('promptsGrid');
  const filter = document.getElementById('searchInput').value.toLowerCase();
  grid.innerHTML = PROMPTS.filter(p => p.nome.toLowerCase().includes(filter)).map((p, i) => `
    <div class="card" id="card-${i}">
      <div class="card-header" onclick="toggleCard(${i})">
        <span class="card-title">📄 ${p.nome}</span>
        <span class="card-arrow">▼</span>
      </div>
      <div class="card-body">
        <pre>${p.prompt}</pre>
        <div class="card-actions">
          <button class="btn-action btn-copy" onclick="copyPrompt(${i}, this)">📋 Copiar</button>
          <a class="btn-action btn-open" href="https://chatgpt.com" target="_blank">🚀 Abrir no ChatGPT</a>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleCard(i) {
  const card = document.getElementById(`card-${i}`);
  card.classList.toggle('open');
}

function copyPrompt(i, btn) {
  navigator.clipboard.writeText(PROMPTS[i].prompt).then(() => {
    btn.textContent = '✅ Copiado!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copiar'; btn.classList.remove('copied'); }, 2000);
  });
}

function filterPrompts() { render(); }

render();
</script>
</body>
</html>
