<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙 Overnight — Mapa do Workflow</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #07070d; color: #e2e8f0; min-height: 100vh; }
  header { padding: 28px 36px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,.07); position: sticky; top: 0; background: rgba(7,7,13,.9); backdrop-filter: blur(10px); z-index: 10; }
  h1 { font-size: 1.3em; } h1 span { color: #818cf8; }
  .relogio { color: #64748b; font-size: .85em; }
  .progresso-global { padding: 22px 36px 0; }
  .barra { height: 10px; background: rgba(255,255,255,.06); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .barra-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #06b6d4); border-radius: 999px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 26px 36px 40px; }
  .coluna { background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.07); border-radius: 16px; padding: 18px; }
  .coluna h2 { font-size: .95em; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .fase-dot { width: 10px; height: 10px; border-radius: 50%; }
  .task { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 14px; margin-bottom: 12px; transition: transform .2s, border-color .2s; }
  .task:hover { transform: translateY(-2px); border-color: rgba(139,148,255,.4); }
  .task.done { border-left: 3px solid #22c55e; opacity: .75; }
  .task.running { border-left: 3px solid #eab308; animation: pulsar 1.6s ease-in-out infinite; }
  .task.error { border-left: 3px solid #ef4444; }
  .task.pending { border-left: 3px solid #475569; }
  .task.skipped { border-left: 3px solid #94a3b8; opacity: .6; }
  @keyframes pulsar { 50% { box-shadow: 0 0 18px rgba(234,179,8,.35); } }
  .task-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .task-id { font-size: .72em; font-weight: 700; color: #818cf8; background: rgba(99,102,241,.15); padding: 2px 8px; border-radius: 6px; }
  .owner { font-size: .72em; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .owner.opencode, .owner.auto { background: rgba(34,197,94,.15); color: #4ade80; }
  .owner.sixth { background: rgba(168,85,247,.15); color: #c084fc; }
  .owner.cline { background: rgba(6,182,212,.15); color: #22d3ee; }
  .owner.humano { background: rgba(245,158,11,.15); color: #fbbf24; }
  .task p { font-size: .86em; line-height: 1.45; }
  .task .resumo { font-size: .76em; color: #4ade80; margin-top: 8px; }
  .task .erro { font-size: .76em; color: #f87171; margin-top: 8px; }
  .deps { font-size: .72em; color: #64748b; margin-top: 8px; }
  .legenda { display: flex; gap: 16px; flex-wrap: wrap; padding: 0 36px 20px; font-size: .78em; color: #94a3b8; }
</style>
</head>
<body>
<header>
  <h1>🌙 Overnight <span>· Mapa do Workflow</span></h1>
  <div class="relogio" id="relogio">—</div>
</header>

<div class="progresso-global">
  <div style="display:flex; justify-content:space-between; font-size:.85em; color:#94a3b8;">
    <span id="meta-nome">Carregando...</span>
    <span id="meta-pct">0%</span>
  </div>
  <div class="barra"><div class="barra-fill" id="barra" style="width:0%"></div></div>
</div>

<div class="legenda">
  <span>🟢 opencode (eu executo)</span><span>🟣 sixth</span><span>🔵 cline</span><span>🟡 humano</span>
  <span style="margin-left:auto;">↻ auto-refresh 5s</span>
</div>

<div class="board" id="board"></div>

<script>
const ICONES = { pending: '⏳', running: '🔄', done: '✅', error: '❌', skipped: '⏭️' };

async function render() {
  try {
    const res = await fetch('workflow.json?ts=' + Date.now());
    const mapa = await res.json();

    document.getElementById('meta-nome').textContent = mapa.meta.nome;
    const total = mapa.tasks.length;
    const feitas = mapa.tasks.filter(t => t.status === 'done').length;
    const pct = Math.round(feitas / total * 100);
    document.getElementById('meta-pct').textContent = `${feitas}/${total} · ${pct}%`;
    document.getElementById('barra').style.width = pct + '%';

    const board = document.getElementById('board');
    board.replaceChildren();
    for (const fase of mapa.fases) {
      const coluna = document.createElement('div');
      coluna.className = 'coluna';

      const titulo = document.createElement('h2');
      const dot = document.createElement('span');
      dot.className = 'fase-dot';
      dot.style.background = fase.cor;
      titulo.append(dot, ` ${fase.id} · ${fase.nome}`);
      coluna.append(titulo);

      for (const tarefa of mapa.tasks.filter(t => t.fase === fase.id)) {
        const task = document.createElement('div');
        task.className = `task ${tarefa.status}`;

        const topo = document.createElement('div');
        topo.className = 'task-topo';

        const id = document.createElement('span');
        id.className = 'task-id';
        id.textContent = `${tarefa.id} ${ICONES[tarefa.status] || ''}`;

        const owner = document.createElement('span');
        owner.className = `owner ${tarefa.owner}`;
        owner.textContent = tarefa.owner;
        topo.append(id, owner);
        task.append(topo);

        const tituloTarefa = document.createElement('p');
        tituloTarefa.textContent = tarefa.titulo;
        task.append(tituloTarefa);

        if ((tarefa.dependencias || []).length) {
          const deps = document.createElement('div');
          deps.className = 'deps';
          deps.textContent = `⛓ depende de: ${tarefa.dependencias.join(', ')}`;
          task.append(deps);
        }

        if (tarefa.output?.resumo) {
          const resumo = document.createElement('div');
          resumo.className = 'resumo';
          resumo.textContent = `→ ${tarefa.output.resumo}`;
          task.append(resumo);
        }

        if (tarefa.output?.erro) {
          const erro = document.createElement('div');
          erro.className = 'erro';
          erro.textContent = `→ ${tarefa.output.erro}`;
          task.append(erro);
        }

        coluna.append(task);
      }

      board.append(coluna);
    }


    document.getElementById('relogio').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR');
  } catch (e) {
    document.getElementById('relogio').textContent = '⚠ workflow.json não encontrado — rode: node dashboard-server.js';
  }
}
render();
setInterval(render, 5000);
</script>
</body>
</html>
