<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContratoFácil — Contratos profissionais em 2 minutos</title>
<style>
  * { margin: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: #f8fafc; color: #0f172a; }
  header { background: #0f172a; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
  header b { color: #38bdf8; }
  .container { max-width: 1100px; margin: 32px auto; padding: 0 20px; display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 28px; }
  h2 { font-size: 1.15em; margin-bottom: 18px; }
  label { display: block; font-size: 0.82em; font-weight: 600; color: #475569; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  input, select, textarea { width: 100%; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95em; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #38bdf8; border-color: transparent; }
  button { width: 100%; margin-top: 22px; padding: 14px; background: #0284c7; color: #fff; border: none; border-radius: 10px; font-size: 1em; font-weight: 700; cursor: pointer; }
  button:hover { background: #0369a1; }
  button:disabled { background: #94a3b8; cursor: wait; }
  #resultado { white-space: pre-wrap; font-family: Georgia, serif; font-size: 0.92em; line-height: 1.7; background: #fffdf5; border: 1px solid #fde68a; border-radius: 12px; padding: 32px; min-height: 400px; }
  #resultado:empty::before { content: '📄 Seu contrato aparecerá aqui...'; color: #a8a29e; font-family: system-ui; }
  .acoes { display: flex; gap: 10px; margin-top: 14px; }
  .acoes button { margin-top: 0; padding: 10px; font-size: 0.85em; background: #475569; }
  .banner-pro { background: linear-gradient(90deg, #0ea5e9, #6366f1); color: #fff; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; font-size: 0.9em; display: flex; justify-content: space-between; align-items: center; }
  .banner-pro a { color: #fff; font-weight: 700; }
  .aviso { font-size: 0.78em; color: #94a3b8; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <span>⚖️ <b>ContratoFácil</b></span>
  <span style="font-size:0.85em; color:#94a3b8;">Freelancers · NDA · Social Media</span>
</header>

<div class="container">
  <div class="card">
    <div class="banner-pro">
      <span>🔓 Plano demo ativo</span>
      <!-- ⚠️ MONETIZAÇÃO: aponte para seu Stripe Payment Link -->
      <a href="https://buy.stripe.com/SEU-LINK" target="_blank">Assinar PRO →</a>
    </div>
    <h2>1. Escolha o modelo</h2>
    <label>Tipo de contrato</label>
    <select id="template"></select>
    <div id="campos"></div>
    <label>Cláusulas adicionais (opcional)</label>
    <textarea id="extras" rows="3" placeholder="Ex: Multa de 10% por atraso de pagamento..."></textarea>
    <button id="btnGerar" onclick="gerar()">2. Gerar Contrato →</button>
    <p class="aviso">Modelos-base educacionais. Sempre recomende revisão por advogado(a).</p>
  </div>

  <div>
    <h2 style="margin-bottom:12px;">3. Revise, copie ou imprima</h2>
    <div id="resultado"></div>
    <div class="acoes">
      <button onclick="copiar()">📋 Copiar</button>
      <button onclick="imprimir()">🖨️ Imprimir / PDF</button>
      <button onclick="baixar()">⬇️ Baixar .txt</button>
    </div>
  </div>
</div>

<script>
const LABELS = {
  contratante: 'Nome do Contratante', cpfContratante: 'CPF/CNPJ do Contratante',
  contratado: 'Nome do(a) Contratado(a)', cpfContratado: 'CPF do(a) Contratado(a)',
  servico: 'Descrição do serviço', valor: 'Valor (ex: R$ 2.500,00)',
  prazo: 'Prazo (ex: 30 dias / 12 meses)', cidade: 'Cidade (foro)',
  parte1: 'Parte Reveladora', parte2: 'Parte Receptora', finalidade: 'Finalidade do NDA'
};
let templates = [];

async function init() {
  const res = await fetch('/api/templates');
  templates = (await res.json()).templates;
  const sel = document.getElementById('template');
  sel.replaceChildren(...templates.map(t => {
    const option = document.createElement('option');
    option.value = t.id;
    option.textContent = t.nome;
    return option;
  }));
  sel.onchange = renderCampos;
  renderCampos();
}

function renderCampos() {
  const t = templates.find(x => x.id === document.getElementById('template').value);
  const campos = document.getElementById('campos');
  campos.replaceChildren(...t.campos.flatMap(c => {
    const label = document.createElement('label');
    label.textContent = LABELS[c] || c;
    const input = document.createElement('input');
    input.id = `f_${c}`;
    input.placeholder = LABELS[c] || c;
    return [label, input];
  }));
}

async function gerar() {
  const templateId = document.getElementById('template').value;
  const t = templates.find(x => x.id === templateId);
  const dados = {};
  t.campos.forEach(c => dados[c] = document.getElementById(`f_${c}`).value);

  const btn = document.getElementById('btnGerar');
  btn.disabled = true; btn.textContent = '⏳ Gerando...';
  try {
    const res = await fetch('/api/gerar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ templateId, dados, clausulasExtras: document.getElementById('extras').value })
    });
    const data = await res.json();
    if (data.erro) { alert('⚠️ ' + data.erro); }
    else { document.getElementById('resultado').textContent = data.contrato; }
  } finally {
    btn.disabled = false; btn.textContent = '2. Gerar Contrato →';
  }
}

function copiar() {
  navigator.clipboard.writeText(document.getElementById('resultado').textContent);
  alert('✅ Copiado!');
}
function imprimir() {
  const w = window.open('', '_blank');
  const pre = w.document.createElement('pre');
  pre.style.fontFamily = 'Georgia';
  pre.style.padding = '40px';
  pre.style.whiteSpace = 'pre-wrap';
  pre.textContent = document.getElementById('resultado').textContent;
  w.document.body.append(pre);
  w.print();
}
function baixar() {
  const blob = new Blob([document.getElementById('resultado').textContent], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'contrato.txt';
  a.click();
}
init();
</script>
</body>
</html>
