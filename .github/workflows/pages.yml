# Deploy automático do GitHub Pages (modo legacy: source = branch gh-pages).
# A cada push no main, copia public-pages/ para a branch gh-pages e faz push —
# o Pages rebuilda sozinho. Substitui o fluxo manual /tmp/ghp-site.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish public-pages/ → gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-pages
          cname: ''
